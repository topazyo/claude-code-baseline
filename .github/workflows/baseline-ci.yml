# claude-code-baseline CI (ROADMAP R3).
#
# Runs the adversarial test suite. The policy-change release gate is in
# policy-gate.yml.
# NOTE: GitHub Actions only runs workflows under the REPOSITORY ROOT's
# .github/workflows/. This file is therefore active once claude-code-baseline is
# its own repository (its intended home). While the directory is vendored inside
# another repo it is dormant; run `bash tests/run.sh` locally instead.
name: claude-code-baseline CI

# No `paths:` filter, deliberately. It previously listed hooks/tests/lib/*.json/
# install.sh, which excluded managed/** and tools/** — the managed-settings
# profiles and the drift reporter got ZERO CI, and the policy gate treats both
# directories as high-risk. A filtered-out job reports no status rather
# than a failing one, and an absent check reads as a green check on the PR page,
# so the gap was invisible. Everything is cheap to run; run it on everything.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Without this the token inherits the
# repository default, which is often read/write on older repositories — far more
# than a test run needs, and a standing target for anything that can influence a
# build step. Jobs may narrow further, never widen.
permissions:
  contents: read

jobs:
  test:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS independently: a Windows-only regression must not be
      # masked by cancelling the matrix on the first Linux failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to a full commit SHA, not a tag. A tag is mutable: the
      # publisher can repoint v7 at new code, so a tag reference is an unreviewed
      # dependency that updates itself inside a job holding the repo token. The
      # trailing comment carries the human-readable version, since the SHA alone
      # tells a reviewer nothing about how stale the pin is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Run baseline test suite
        # `shell: bash` on windows-latest uses the bundled Git Bash, which is the
        # environment the install and hook scripts actually target on Windows.
        # This job exists because the docs claim Windows support and nothing
        # verified it: the interpreter-resolution and CRLF defects were both
        # Windows-only and both reached main.
        shell: bash
        # Names this leg for tests/ci_expect.sh, which checks each suite's skips and
        # pass count against what this runner is expected to produce.
        env:
          BCL_CI_LEG: ${{ matrix.os }}
        run: bash tests/run.sh

  # The docs and install.sh accept Python 3.7, and the job above only ever sees the
  # newest 3.x. A 3.8+ API (shlex.join) and a runtime `list[str]` both reached main
  # that way, so the whole suite also runs on the oldest Python it claims to support,
  # on both operating systems (the Windows code paths differ). In the
  # actions/python-versions manifest the Linux 3.7 builds are for ubuntu-22.04 x64
  # only (3.7.17), hence that image; Windows has 3.7.9 (x64). When ubuntu-22.04 is
  # retired, raise the documented floor (README, install.sh) to the oldest version
  # setup-python still ships for a supported image, or run that leg in a container.
  python-floor:
    name: Python floor (3.7, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.7"
      - name: Confirm the suite will run on Python 3.7
        # run.sh and the hooks take python3, else python, from PATH. Each of the two
        # that resolves must be 3.7, or this leg would quietly test another Python.
        shell: bash
        run: |
          found=0
          for py in python3 python; do
            command -v "$py" >/dev/null 2>&1 || continue
            found=1
            echo "$py -> $(command -v "$py")"
            "$py" -c 'import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 7))' || exit 1
          done
          [ "$found" = 1 ]
      - name: Run baseline test suite
        shell: bash
        env:
          BCL_CI_LEG: python-floor-${{ matrix.os }}
        run: bash tests/run.sh

# The policy-change release gate lives in policy-gate.yml, which runs on
# pull_request only. It used to be a job here with `if: github.event_name ==
# 'pull_request'`: on a push run that job was SKIPPED, a skipped job reports
# "Success", and it posted that under the same check name as the real PR run on
# the same head commit — so the required check could be satisfied by the skip.
